<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>💰 Зарплаты гильдии Russian Socialist Republic</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 30px;
        }
        .search-box {
            text-align: center;
            margin: 30px 0;
        }
        input {
            padding: 12px;
            width: 300px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 8px;
            margin-right: 10px;
        }
        button {
            padding: 12px 24px;
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background: #219653;
        }
        .player-info {
            margin-top: 30px;
            padding: 20px;
            background: #e8f5e9;
            border-radius: 10px;
            display: none;
        }
        .player-info h3 {
            color: #27ae60;
            margin-top: 0;
        }
        .info-item {
            margin: 10px 0;
            font-size: 16px;
        }
        .salary {
            font-size: 24px;
            font-weight: bold;
            color: #27ae60;
            text-align: center;
            margin: 20px 0;
        }
        .last-update {
            text-align: center;
            color: #7f8c8d;
            font-size: 14px;
            margin-top: 30px;
        }
        .error {
            color: #e74c3c;
            text-align: center;
            padding: 15px;
            background: #ffebee;
            border-radius: 8px;
            margin-top: 20px;
        }
        .history-section {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            display: none;
        }
        .history-section h4 {
            color: #2c3e50;
            margin-top: 0;
            border-bottom: 2px solid #ddd;
            padding-bottom: 10px;
        }
        .history-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        .history-table th {
            background-color: #2c3e50;
            color: white;
            padding: 12px;
            text-align: left;
        }
        .history-table td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }
        .history-table tr:hover {
            background-color: #f1f1f1;
        }
        .positive-amount {
            color: #27ae60;
            font-weight: bold;
        }
        .negative-amount {
            color: #e74c3c;
            font-weight: bold;
        }
        .neutral-amount {
            color: #7f8c8d;
            font-weight: bold;
        }
        .operation-type {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }
        .operation-type-nachislenie {
            background-color: #3498db;
            color: white;
        }
        .operation-type-vyplata {
            background-color: #2ecc71;
            color: white;
        }
        .operation-type-nagrada {
            background-color: #9b59b6;
            color: white;
        }
        .operation-type-otmena {
            background-color: #e67e22;
            color: white;
        }
        .empty-history {
            text-align: center;
            color: #7f8c8d;
            padding: 20px;
            font-style: italic;
        }
        .total-summary {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            padding: 15px;
            background: #e3f2fd;
            border-radius: 8px;
        }
        .summary-item {
            text-align: center;
            flex: 1;
        }
        .summary-value {
            font-size: 18px;
            font-weight: bold;
            color: #2c3e50;
        }
        .summary-label {
            font-size: 14px;
            color: #7f8c8d;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💰 Зарплаты гильдии Russian Socialist Republic</h1>
        
        <div class="search-box">
            <input type="text" id="nicknameInput" 
                   placeholder="Введите ваш ник в игре..." 
                   autofocus>
            <button onclick="searchPlayer()">Найти зарплату и историю</button>
        </div>
        
        <div id="result" class="player-info">
            <!-- Здесь появится информация об игроке -->
        </div>
        
        <div id="history" class="history-section">
            <!-- Здесь появится история транзакций -->
        </div>
        
        <div class="last-update">
            <p>Данные обновляются автоматически. Для поиска введите ваш ник.</p>
        </div>
    </div>

    <script>
        // Функция поиска игрока
        function searchPlayer() {
            const nickname = document.getElementById('nicknameInput').value.trim();
            const resultDiv = document.getElementById('result');
            const historyDiv = document.getElementById('history');
            
            if (!nickname) {
                resultDiv.innerHTML = '<div class="error">Введите ник игрока</div>';
                resultDiv.style.display = 'block';
                historyDiv.style.display = 'none';
                return;
            }
            
            // Загружаем основные данные
            fetch('data.json')
                .then(response => {
                    if (!response.ok) throw new Error('Данные не загружены');
                    return response.json();
                })
                .then(data => {
                    const player = data.players.find(p => 
                        p.nickname.toLowerCase() === nickname.toLowerCase()
                    );
                    
                    if (player) {
                        // Отображаем информацию об игроке
                        resultDiv.innerHTML = `
                            <h3>👤 ${player.nickname}</h3>
                            <div class="salary">${player.total_salary} серебра</div>
                            <div class="total-summary">
                                <div class="summary-item">
                                    <div class="summary-value">${player.rank}</div>
                                    <div class="summary-label">Текущее звание</div>
                                </div>
                                <div class="summary-item">
                                    <div class="summary-value">${player.days_in_guild}</div>
                                    <div class="summary-label">Дней в гильдии</div>
                                </div>
                                <div class="summary-item">
                                    <div class="summary-value">${player.is_recruiter ? 'Да' : 'Нет'}</div>
                                    <div class="summary-label">Рекрутер</div>
                                </div>
                            </div>
                            <div class="info-item"><strong>Дата вступления:</strong> ${player.join_date}</div>
                            <div class="last-update" style="margin-top: 20px;">
                                <small>Обновлено: ${data.last_updated}</small>
                            </div>
                        `;
                        
                        // Загружаем историю для этого игрока
                        loadPlayerHistory(player.nickname);
                        
                    } else {
                        resultDiv.innerHTML = '<div class="error">Игрок не найден. Проверьте правильность ника.</div>';
                        historyDiv.style.display = 'none';
                    }
                    
                    resultDiv.style.display = 'block';
                })
                .catch(error => {
                    resultDiv.innerHTML = '<div class="error">Ошибка загрузки данных. Попробуйте позже.</div>';
                    resultDiv.style.display = 'block';
                    historyDiv.style.display = 'none';
                    console.error('Error:', error);
                });
        }
        
        // Функция загрузки истории игрока
        function loadPlayerHistory(nickname) {
            const historyDiv = document.getElementById('history');
            
            fetch('history.json')
                .then(response => {
                    if (!response.ok) throw new Error('История не загружена');
                    return response.json();
                })
                .then(historyData => {
                    // Фильтруем историю по нику игрока
                    const playerHistory = historyData.history.filter(item => 
                        item.player_nickname.toLowerCase() === nickname.toLowerCase()
                    );
                    
                    // Сортируем по дате (сначала новые)
                    playerHistory.sort((a, b) => new Date(b.operation_date) - new Date(a.operation_date));
                    
                    // Рассчитываем статистику
                    let totalEarned = 0;
                    let totalPaid = 0;
                    let transactionCount = playerHistory.length;
                    
                    playerHistory.forEach(item => {
                        if (item.operation_type === 'Начисление' || item.operation_type === 'Награда рекрутера') {
                            totalEarned += item.amount;
                        } else if (item.operation_type === 'Выплата') {
                            totalPaid += item.amount;
                        }
                    });
                    
                    if (playerHistory.length > 0) {
                        let historyHTML = `
                            <h4>📜 История операций игрока ${nickname}</h4>
                            <div class="total-summary">
                                <div class="summary-item">
                                    <div class="summary-value">${transactionCount}</div>
                                    <div class="summary-label">Всего операций</div>
                                </div>
                                <div class="summary-item">
                                    <div class="summary-value">${totalEarned} серебра</div>
                                    <div class="summary-label">Всего заработано</div>
                                </div>
                                <div class="summary-item">
                                    <div class="summary-value">${totalPaid} серебра</div>
                                    <div class="summary-label">Всего выплачено</div>
                                </div>
                            </div>
                            <table class="history-table">
                                <thead>
                                    <tr>
                                        <th>Дата</th>
                                        <th>Тип операции</th>
                                        <th>Сумма</th>
                                        <th>Комментарий</th>
                                    </tr>
                                </thead>
                                <tbody>`;
                        
                        playerHistory.forEach(item => {
                            // Определяем класс для типа операции
                            let operationClass = '';
                            switch(item.operation_type) {
                                case 'Начисление':
                                    operationClass = 'operation-type-nachislenie';
                                    break;
                                case 'Выплата':
                                    operationClass = 'operation-type-vyplata';
                                    break;
                                case 'Награда рекрутера':
                                    operationClass = 'operation-type-nagrada';
                                    break;
                                case 'Отмена начисления':
                                case 'Отмена выплаты':
                                    operationClass = 'operation-type-otmena';
                                    break;
                                default:
                                    operationClass = '';
                            }
                            
                            // Определяем класс для суммы
                            let amountClass = '';
                            if (item.amount > 0) {
                                amountClass = 'positive-amount';
                            } else if (item.amount < 0) {
                                amountClass = 'negative-amount';
                            } else {
                                amountClass = 'neutral-amount';
                            }
                            
                            // Форматируем дату
                            const date = new Date(item.operation_date);
                            const formattedDate = date.toLocaleDateString('ru-RU', {
                                day: '2-digit',
                                month: '2-digit',
                                year: 'numeric',
                                hour: '2-digit',
                                minute: '2-digit'
                            });
                            
                            // Форматируем сумму со знаком
                            const formattedAmount = item.amount > 0 ? `+${item.amount}` : item.amount;
                            
                            // Добавляем информацию о часах активности, если есть
                            let comment = item.comment || '';
                            if (item.hours && item.hours > 0 && item.activity_name) {
                                comment += ` (${item.activity_name}, ${item.hours} час.)`;
                            }
                            
                            historyHTML += `
                                <tr>
                                    <td>${formattedDate}</td>
                                    <td><span class="operation-type ${operationClass}">${item.operation_type}</span></td>
                                    <td class="${amountClass}">${formattedAmount} серебра</td>
                                    <td>${comment}</td>
                                </tr>`;
                        });
                        
                        historyHTML += `
                                </tbody>
                            </table>`;
                        
                        historyDiv.innerHTML = historyHTML;
                    } else {
                        historyDiv.innerHTML = `
                            <h4>📜 История операций игрока ${nickname}</h4>
                            <div class="empty-history">
                                <p>История операций отсутствует</p>
                            </div>`;
                    }
                    
                    historyDiv.style.display = 'block';
                })
                .catch(error => {
                    historyDiv.innerHTML = `
                        <h4>📜 История операций</h4>
                        <div class="empty-history">
                            <p>Не удалось загрузить историю операций</p>
                        </div>`;
                    historyDiv.style.display = 'block';
                    console.error('Error loading history:', error);
                });
        }
        
        // Поиск при нажатии Enter
        document.getElementById('nicknameInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchPlayer();
            }
        });
        
        // Показываем последние данные при загрузке
        window.addEventListener('DOMContentLoaded', () => {
            fetch('data.json')
                .then(response => response.json())
                .then(data => {
                    console.log('Данные загружены. Игроков:', data.players.length);
                });
        });
    </script>
</body>
</html>
