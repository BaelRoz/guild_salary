<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💰 Зарплаты гильдии</title>
    
    <!-- Аналитика (опционально) -->
    <script>
        // Простая аналитика
        function trackEvent(action, label) {
            console.log('Аналитика:', action, label);
            if (localStorage) {
                let stats = JSON.parse(localStorage.getItem('guild_stats') || '{"searches":0,"theme":"light"}');
                if (action === 'search') stats.searches = (stats.searches || 0) + 1;
                if (action === 'theme') stats.theme = label;
                localStorage.setItem('guild_stats', JSON.stringify(stats));
            }
        }
        
        // Показываем статистику в консоли
        window.addEventListener('load', () => {
            if (localStorage) {
                let stats = JSON.parse(localStorage.getItem('guild_stats') || '{}');
                console.log('📊 Статистика использования:', stats);
            }
        });
    </script>
    
    <style>
        :root {
            /* Переменные для светлой темы */
            --bg-primary: #f5f5f5;
            --bg-secondary: white;
            --bg-tertiary: #e8f5e9;
            --text-primary: #2c3e50;
            --text-secondary: #7f8c8d;
            --accent-primary: #27ae60;
            --accent-secondary: #219653;
            --error-bg: #ffebee;
            --error-text: #e74c3c;
            --border: #ddd;
            --shadow: rgba(0,0,0,0.1);
        }
        
        [data-theme="dark"] {
            /* Переменные для темной темы */
            --bg-primary: #121212;
            --bg-secondary: #1e1e1e;
            --bg-tertiary: #2d2d2d;
            --text-primary: #e0e0e0;
            --text-secondary: #a0a0a0;
            --accent-primary: #4CAF50;
            --accent-secondary: #45a049;
            --error-bg: #4a1c1c;
            --error-text: #ff6b6b;
            --border: #404040;
            --shadow: rgba(0,0,0,0.3);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: var(--bg-secondary);
            border-radius: 15px;
            box-shadow: 0 5px 15px var(--shadow);
            margin-top: 20px;
            margin-bottom: 20px;
        }
        
        h1 {
            color: var(--accent-primary);
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.2em;
            position: relative;
            padding-bottom: 15px;
        }
        
        h1::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 3px;
            background: var(--accent-primary);
            border-radius: 2px;
        }
        
        /* Кнопка переключения темы */
        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--accent-primary);
            color: white;
            border: none;
            cursor: pointer;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 3px 10px var(--shadow);
            z-index: 1000;
        }
        
        .theme-toggle:hover {
            background: var(--accent-secondary);
            transform: scale(1.1);
        }
        
        /* Блок поиска */
        .search-box {
            text-align: center;
            margin: 40px 0;
            position: relative;
        }
        
        .search-container {
            display: flex;
            gap: 10px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }
        
        input {
            padding: 14px 20px;
            width: 100%;
            max-width: 400px;
            font-size: 16px;
            border: 2px solid var(--border);
            border-radius: 10px;
            background: var(--bg-primary);
            color: var(--text-primary);
            transition: all 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(39, 174, 96, 0.2);
        }
        
        button {
            padding: 14px 28px;
            background: var(--accent-primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            white-space: nowrap;
        }
        
        button:hover {
            background: var(--accent-secondary);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(39, 174, 96, 0.3);
        }
        
        /* Информация об игроке */
        .player-info {
            margin-top: 40px;
            padding: 30px;
            background: var(--bg-tertiary);
            border-radius: 15px;
            border-left: 5px solid var(--accent-primary);
            display: none;
            animation: fadeIn 0.5s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .player-info h3 {
            color: var(--accent-primary);
            margin-bottom: 20px;
            font-size: 1.8em;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .player-info h3::before {
            content: '👤';
            font-size: 1.5em;
        }
        
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .info-item {
            background: var(--bg-secondary);
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 5px var(--shadow);
        }
        
        .info-item strong {
            color: var(--accent-primary);
            display: block;
            margin-bottom: 5px;
            font-size: 0.9em;
        }
        
        .salary {
            font-size: 2.5em;
            font-weight: bold;
            color: var(--accent-primary);
            text-align: center;
            margin: 30px 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        .last-update {
            text-align: center;
            color: var(--text-secondary);
            font-size: 14px;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }
        
        .error {
            color: var(--error-text);
            text-align: center;
            padding: 20px;
            background: var(--error-bg);
            border-radius: 10px;
            margin-top: 20px;
            border-left: 5px solid var(--error-text);
            animation: shake 0.5s;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        
        /* Статистика */
        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: var(--bg-tertiary);
            border-radius: 10px;
            margin-bottom: 30px;
            font-size: 0.9em;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .stat-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        /* Мобильная адаптивность */
        @media (max-width: 768px) {
            .container {
                margin: 10px;
                padding: 15px;
                border-radius: 10px;
            }
            
            h1 {
                font-size: 1.8em;
                margin-bottom: 20px;
            }
            
            .search-container {
                flex-direction: column;
            }
            
            input, button {
                width: 100%;
                max-width: 100%;
            }
            
            .theme-toggle {
                top: 10px;
                right: 10px;
                width: 40px;
                height: 40px;
                font-size: 20px;
            }
            
            .player-info {
                padding: 20px;
            }
            
            .salary {
                font-size: 2em;
            }
            
            .info-grid {
                grid-template-columns: 1fr;
            }
        }
        
        @media (max-width: 480px) {
            h1 {
                font-size: 1.5em;
            }
            
            .container {
                padding: 10px;
            }
            
            input, button {
                padding: 12px;
                font-size: 14px;
            }
            
            .stats-bar {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
        }
        
        /* Подсказка при наведении */
        [title] {
            position: relative;
            cursor: help;
        }
        
        [title]::after {
            content: attr(title);
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: var(--text-primary);
            color: var(--bg-secondary);
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 100;
        }
        
        [title]:hover::after {
            opacity: 1;
        }
    </style>
</head>
<body>
    <!-- Кнопка переключения темы -->
    <button class="theme-toggle" title="Сменить тему">🌙</button>
    
    <div class="container">
        <h1>💰 Зарплаты гильдии Albion Online</h1>
        
        <!-- Статистика -->
        <div class="stats-bar" id="statsBar">
            <div class="stat-item">
                <span>👥 Игроков:</span>
                <span id="totalPlayers">0</span>
            </div>
            <div class="stat-item">
                <span>💰 Общая сумма:</span>
                <span id="totalSalary">0 серебра</span>
            </div>
            <div class="stat-item">
                <span>🔄 Поисков:</span>
                <span id="searchCount">0</span>
            </div>
        </div>
        
        <!-- Блок поиска -->
        <div class="search-box">
            <div class="search-container">
                <input type="text" 
                       id="nicknameInput" 
                       placeholder="Введите ваш ник в игре..." 
                       autofocus
                       title="Введите игровой ник для поиска зарплаты">
                <button onclick="searchPlayer()" title="Найти зарплату игрока">🔍 Найти зарплату</button>
            </div>
        </div>
        
        <!-- Результат поиска -->
        <div id="result" class="player-info">
            <!-- Здесь появится информация об игроке -->
        </div>
        
        <!-- Время обновления -->
        <div class="last-update">
            <p>Данные обновляются автоматически. Для поиска введите ваш ник.</p>
            <p id="lastUpdated">Загрузка времени обновления...</p>
        </div>
    </div>

    <script>
        // Инициализация темы
        function initTheme() {
            const savedTheme = localStorage.getItem('guild_theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
            updateThemeButton(savedTheme);
        }
        
        // Переключение темы
        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('guild_theme', newTheme);
            updateThemeButton(newTheme);
            trackEvent('theme', newTheme);
        }
        
        // Обновление кнопки темы
        function updateThemeButton(theme) {
            const button = document.querySelector('.theme-toggle');
            button.textContent = theme === 'light' ? '🌙' : '☀️';
            button.title = theme === 'light' ? 'Включить темную тему' : 'Включить светлую тему';
        }
        
        // Загрузка данных
        let guildData = null;
        
        async function loadData() {
            try {
                const response = await fetch('data.json');
                if (!response.ok) throw new Error('Данные не загружены');
                guildData = await response.json();
                
                // Обновляем статистику
                document.getElementById('totalPlayers').textContent = guildData.total_players;
                document.getElementById('totalSalary').textContent = 
                    guildData.total_salary_pool.toLocaleString() + ' серебра';
                document.getElementById('lastUpdated').textContent = 
                    'Последнее обновление: ' + guildData.last_updated;
                
                // Обновляем счетчик поисков
                updateSearchStats();
                
                console.log('✅ Данные загружены. Игроков:', guildData.players.length);
                return true;
            } catch (error) {
                console.error('❌ Ошибка загрузки данных:', error);
                return false;
            }
        }
        
        // Функция поиска игрока
        function searchPlayer() {
            const nickname = document.getElementById('nicknameInput').value.trim();
            const resultDiv = document.getElementById('result');
            
            if (!nickname) {
                showError('Введите ник игрока');
                return;
            }
            
            if (!guildData) {
                showError('Данные не загружены. Попробуйте позже.');
                return;
            }
            
            trackEvent('search', nickname);
            
            const player = guildData.players.find(p => 
                p.nickname.toLowerCase() === nickname.toLowerCase()
            );
            
            if (player) {
                // Форматируем дату
                const joinDate = new Date(player.join_date);
                const formattedDate = joinDate.toLocaleDateString('ru-RU', {
                    day: '2-digit',
                    month: '2-digit',
                    year: 'numeric'
                });
                
                // Отображаем информацию об игроке
                resultDiv.innerHTML = `
                    <h3>${player.nickname}</h3>
                    <div class="salary">${player.total_salary.toLocaleString()} серебра</div>
                    <div class="info-grid">
                        <div class="info-item">
                            <strong>Звание</strong>
                            <span>${player.rank}</span>
                        </div>
                        <div class="info-item">
                            <strong>Дней в гильдии</strong>
                            <span>${Math.round(player.days_in_guild)}</span>
                        </div>
                        <div class="info-item">
                            <strong>Рекрутер</strong>
                            <span>${player.is_recruiter ? '✅ Да' : '❌ Нет'}</span>
                        </div>
                        <div class="info-item">
                            <strong>Дата вступления</strong>
                            <span>${formattedDate}</span>
                        </div>
                    </div>
                `;
                resultDiv.style.display = 'block';
                
                // Сохраняем поиск в статистику
                saveSearchStats();
            } else {
                showError('Игрок не найден. Проверьте правильность ника.');
            }
        }
        
        // Показать ошибку
        function showError(message) {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = `<div class="error">${message}</div>`;
            resultDiv.style.display = 'block';
        }
        
        // Статистика поисков
        function saveSearchStats() {
            if (localStorage) {
                let stats = JSON.parse(localStorage.getItem('guild_stats') || '{"searches":0}');
                stats.searches = (stats.searches || 0) + 1;
                localStorage.setItem('guild_stats', JSON.stringify(stats));
                updateSearchStats();
            }
        }
        
        function updateSearchStats() {
            if (localStorage) {
                let stats = JSON.parse(localStorage.getItem('guild_stats') || '{}');
                document.getElementById('searchCount').textContent = stats.searches || 0;
            }
        }
        
        // Инициализация при загрузке
        document.addEventListener('DOMContentLoaded', () => {
            // Инициализация темы
            initTheme();
            
            // Загрузка данных
            loadData();
            
            // Поиск при нажатии Enter
            document.getElementById('nicknameInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    searchPlayer();
                }
            });
            
            // Кнопка переключения темы
            document.querySelector('.theme-toggle').addEventListener('click', toggleTheme);
            
            // Фокус на поле ввода
            document.getElementById('nicknameInput').focus();
        });
        
        // Обновление данных каждые 5 минут
        setInterval(() => {
            loadData();
            console.log('🔄 Данные обновлены автоматически');
        }, 5 * 60 * 1000);
        
        // Обновление при возвращении на вкладку
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) {
                loadData();
            }
        });
    </script>
</body>
</html>
